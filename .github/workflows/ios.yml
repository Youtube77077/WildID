name: iOS build & tests
on:
  push:
    branches: ['**']
    paths:
      - 'WildID/**'
      - 'WildIDTests/**'
      - 'WildID.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-xcode26:
    name: Device build with Xcode 26
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project WildID.xcodeproj -scheme WildID -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device26 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build26.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build26.log

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build for device (unsigned) — proves it compiles for a real iPhone
        run: |
          set -o pipefail
          xcodebuild -project WildID.xcodeproj -scheme WildID -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: Unit tests (iOS Simulator)
        timeout-minutes: 25
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda kx: ('iOS-18' not in kx[0], kx[1]['name']!='iPhone 16', kx[1]['name']))
          print(c[0][1]['udid'])")
          perl -e 'alarm shift; exec @ARGV' 1200 xcodebuild -project WildID.xcodeproj -scheme WildID \
            -destination "id=$UDID" -derivedDataPath build/sim \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | grep -E --line-buffered "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|Testing started|Restarting" || true
          grep -q "TEST SUCCEEDED" test.log || { echo "---- tail of test log ----"; tail -n 120 test.log; exit 1; }
      - name: Package unsigned .ipa (for sideloading tools that re-sign)
        if: success()
        run: |
          APP=$(find build/device -name "WildID.app" -type d | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry WildID-unsigned.ipa Payload
          du -h WildID-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WildID-unsigned-ipa
          path: WildID-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: '*.log'
