name: Evaluate BirdNET on real recordings
on:
  push:
    branches: ['**']
    paths: ['tools/eval/**', '.github/workflows/evaluate.yml']
  workflow_dispatch:
    inputs:
      lat: { default: '52.46' }
      lng: { default: '5.03' }
      species: { default: '40' }

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q "tensorflow==2.17.0" "numpy<2"
      - uses: actions/cache@v4
        with:
          path: work/eval
          key: eval-cache-${{ github.run_id }}
          restore-keys: eval-cache-
      - name: Evaluate
        run: |
          python3 tools/eval/evaluate_birdnet.py \
            --lat "${{ github.event.inputs.lat || '52.46' }}" --lng "${{ github.event.inputs.lng || '5.03' }}" \
            --species "${{ github.event.inputs.species || '40' }}" --per-species 4 --out tools/eval/reports
      - name: Commit report to this branch
        run: |
          git config user.name "wildid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/eval/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update BirdNET evaluation report [automated]"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
