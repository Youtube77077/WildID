name: Simulator screenshots
on:
  push:
    branches: ['**']
    paths:
      - 'WildID/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUNDLE: io.github.youtube77077.wildid
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda kx: ('iOS-18' not in kx[0], kx[1]['name']!='iPhone 16', kx[1]['name']))
          print(c[0][1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$UDID"
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project WildID.xcodeproj -scheme WildID -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Boot, install, grant permissions, set location
        timeout-minutes: 12
        run: |
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break
            sleep 5
          done
          sleep 20
          xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/WildID.app
          for s in location microphone photos camera; do xcrun simctl privacy "$UDID" grant $s "$BUNDLE" || true; done
          xcrun simctl location "$UDID" set 52.4588,5.0307
      - name: Capture screens
        timeout-minutes: 20
        run: |
          mkdir -p docs/screenshots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -wildid-skip-onboarding "$@"
            sleep ${WAIT:-14}
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$name.png"
          }
          rm -f docs/screenshots/*.png
          D=-wildid-demo-data
          WAIT=24 shot 01-home $D
          WAIT=12 shot 02-identify $D -wildid-open identify
          WAIT=12 shot 03-sound-id $D -wildid-open sound
          WAIT=10 shot 04-photo-id $D -wildid-open photo
          WAIT=10 shot 05-step-by-step $D -wildid-open guided
          WAIT=12 shot 06-sound-sessions $D -wildid-open recordings
          WAIT=24 shot 07-map-both $D -wildid-tab map
          WAIT=24 shot 08-map-my-catches $D -wildid-tab map -wildid-map-mode mine
          WAIT=24 shot 09-map-community $D -wildid-tab map -wildid-map-mode community
          WAIT=22 shot 10-wild-index $D -wildid-tab index
          WAIT=26 shot 11-wild-index-entry $D -wildid-entry "Vulpes vulpes"
          WAIT=20 shot 12-achievements $D -wildid-open achievements
          WAIT=22 shot 13-wildlings $D -wildid-tab wildlings
          WAIT=26 shot 14-wildling-detail $D -wildid-pet "Vulpes vulpes"
          WAIT=16 shot 15-wildlings-guide $D -wildid-open wildlings-guide
          WAIT=22 shot 16-explore $D -wildid-tab explore
          WAIT=22 shot 17-species $D -wildid-species "Lutra lutra"
          WAIT=10 shot 18-settings $D -wildid-open settings
          WAIT=14 shot 19-new-animal $D -wildid-demo-toast new
          WAIT=14 shot 20-new-animal-during-sound-id $D -wildid-open sound -wildid-demo-toast new
          WAIT=14 shot 21-level-up $D -wildid-tab wildlings -wildid-demo-toast levelup
          WAIT=26 shot 22-wildling-kangaroo $D -wildid-pet "Macropus giganteus"
          WAIT=24 shot 23-profile $D -wildid-open profile
          WAIT=8 shot 24-sign-in $D -wildid-auth signin
          WAIT=8 shot 25-create-account $D -wildid-auth signup
          ls -la docs/screenshots
      - name: Commit screenshots to this branch
        run: |
          git config user.name "wildid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update simulator screenshots [automated]"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
