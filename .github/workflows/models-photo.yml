name: Convert photo models (AIY birds/insects -> Core ML)
on:
  push:
    branches: ['**']
    paths: ['tools/models/convert_aiy_vision.py', '.github/workflows/models-photo.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q tensorflow==2.15.1 tensorflow-hub==0.16.1 coremltools==8.1 "numpy<2" pillow
      - run: python3 tools/models/convert_aiy_vision.py --out WildID/Resources/Models --work work/aiy
      - name: Commit converted photo models
        run: |
          git config user.name "wildid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WildID/Resources/Models
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Add AIY bird/insect photo classifiers (Apache 2.0) [automated]"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
