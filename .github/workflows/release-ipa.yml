name: Build WildID.ipa
on:
  push:
    branches: ['**']
    paths: ['WildID/**', 'WildID.xcodeproj/**', 'Config/**', '.github/workflows/release-ipa.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build for device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project WildID.xcodeproj -scheme WildID -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package WildID.ipa
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/WildID.app Payload/
          zip -qry WildID.ipa Payload
          du -h WildID.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WildID-ipa
          path: WildID.ipa
          retention-days: 90
      - name: Commit dist/WildID.ipa (only for commits tagged [ipa])
        if: contains(github.event.head_commit.message, '[ipa]')
        run: |
          mkdir -p dist && cp WildID.ipa dist/WildID.ipa
          printf "Built from %s (%s)\nUnsigned: sign with Sideloadly/AltStore using your Apple ID.\n" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)" > dist/BUILD_INFO.txt
          git config user.name "wildid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -q -m "Update dist/WildID.ipa [automated]" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
