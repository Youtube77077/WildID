name: Publish .ipa (latest build)
on:
  push:
    branches: ['**']
    paths: ['WildID/**', 'WildID.xcodeproj/**', 'Config/**', '.github/workflows/release-ipa.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build for device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project WildID.xcodeproj -scheme WildID -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/WildID.app
      - name: Package WildID.ipa
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/WildID.app Payload/
          zip -qry WildID.ipa Payload
          du -h WildID.ipa
      - name: Publish as the "latest-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned WildID build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}.
          iPhones only install signed apps: open this .ipa with Sideloadly or AltStore and sign it with your own Apple ID (free), or build from Xcode (see README)."
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build WildID.ipa --target "$GITHUB_SHA" --prerelease \
            --title "WildID latest build (${GITHUB_SHA::7})" --notes "$NOTES"
