name: Probe (research)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml', 'tools/probe/**']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Only one of these is expected to be set; values are never printed.
      XC_CANDIDATE_1: ${{ secrets.XENO_CANTO_API_KEY }}
      XC_CANDIDATE_2: ${{ secrets.XENOCANTO_API_KEY }}
      XC_CANDIDATE_3: ${{ secrets.XC_API_KEY }}
      XC_CANDIDATE_4: ${{ secrets.XENO_API_KEY }}
      XC_CANDIDATE_5: ${{ secrets.XENO_CANTO_KEY }}
      XC_CANDIDATE_6: ${{ secrets.XENO_KEY }}
      XC_CANDIDATE_7: ${{ secrets.XC_KEY }}
      XC_CANDIDATE_8: ${{ secrets.XENO }}
    steps:
      - uses: actions/checkout@v4
      - name: Xeno-canto docs + API
        run: python3 tools/probe/xc_probe.py
  birdnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q tensorflow==2.17.0 numpy
      - run: python3 tools/probe/birdnet_probe.py
  mac:
    runs-on: macos-15
    steps:
      - run: xcodebuild -version; xcrun simctl list runtimes; xcrun simctl list devices available | head -40; ls /Applications | grep -i xcode
