name: Data coverage stats
on:
  push:
    branches: ['**']
    paths: ['tools/stats/**', '.github/workflows/stats.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Count species, photos, sounds, subspecies per group
        run: python3 tools/stats/dataset_stats.py
      - name: Commit report to this branch
        run: |
          git config user.name "wildid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/stats/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update data coverage stats [automated]"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*10)); done
